# Runs the frontend and backend test suites on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: latex-p2p-editor/package-lock.json
      - working-directory: latex-p2p-editor
        run: npm ci
      - working-directory: latex-p2p-editor
        run: npm test
      - working-directory: latex-p2p-editor
        run: npm run build

  backend:
    # 24.04: the Tectonic binary from drop-sh needs glibc >= 2.39 (22.04 has 2.35).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: latex-p2p-editor/src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Tectonic (compile tests)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
      - working-directory: latex-p2p-editor/src-tauri
        run: cargo test
