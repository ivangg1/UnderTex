# Builds signed desktop bundles for macOS (Apple Silicon + Intel), Windows and
# Linux and publishes them as a GitHub Release, together with the updater
# artifacts and `latest.json` the in-app auto-updater reads.
#
# Trigger: push a tag like `v0.2.0` (or create a release with a new tag in the
# GitHub UI). The version is taken from the tag; nothing has to be bumped by
# hand. Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: latex-p2p-editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: latex-p2p-editor/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The tag is the single source of truth for the version: v0.1.5 builds
      # 0.1.5 everywhere, so latest.json always announces a newer version.
      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: latex-p2p-editor
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Install frontend dependencies
        working-directory: latex-p2p-editor
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: latex-p2p-editor
          tagName: ${{ github.ref_name }}
          releaseName: "LaTeX P2P ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. Installed copies update themselves."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
