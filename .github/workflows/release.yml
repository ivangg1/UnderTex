# Builds signed desktop bundles for macOS (Apple Silicon + Intel), Windows and
# Linux and publishes them as a GitHub Release, together with the updater
# artifacts and `latest.json` the in-app auto-updater reads.
#
# Trigger: push a tag like `v0.2.0` (or create a release with a new tag in the
# GitHub UI). The version is taken from the tag; nothing has to be bumped by
# hand. Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
#
# Windows code signing (SignPath, optional; see docs/code-signing.md). Enabled
# when the repository variable SIGNPATH_ORGANIZATION_ID is set, with:
#   secret   SIGNPATH_API_TOKEN
#   vars     SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#            SIGNPATH_SIGNING_POLICY_SLUG (e.g. release-signing)
# The release is created as a draft and only published once the Windows
# installers are signed (or right away when signing is not configured).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: latex-p2p-editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: latex-p2p-editor/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The tag is the single source of truth for the version: v0.1.5 builds
      # 0.1.5 everywhere, so latest.json always announces a newer version.
      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: latex-p2p-editor
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      # Ship a LaTeX engine inside the installer so users install nothing else.
      - name: Bundle Tectonic
        working-directory: latex-p2p-editor
        run: node scripts/fetch-tectonic.mjs ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: latex-p2p-editor
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: latex-p2p-editor
          tagName: ${{ github.ref_name }}
          releaseName: "UnderTeX ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. Installed copies update themselves."
          # Published by the `publish` job, after Windows signing.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.bundle-tectonic.conf.json

  sign-windows:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the unsigned Windows installers and latest.json
        run: |
          mkdir -p unsigned
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir unsigned --pattern '*-setup.exe' --pattern '*.msi'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'latest.json' --output latest.json
          ls -la unsigned

      - name: Upload installers for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/*
          if-no-files-found: error

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Regenerate updater signatures and patch latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .github/scripts/resign-windows.mjs signed latest.json

      - name: Replace the release files with the signed ones
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber signed/*.exe signed/*.msi signed/*.sig latest.json

  publish:
    needs: [build, sign-windows]
    # Runs when signing succeeded or was skipped (not configured), never after a failure.
    if: always() && needs.build.result == 'success' && needs.sign-windows.result != 'failure' && needs.sign-windows.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the release
        run: gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
