# Builds signed desktop bundles for macOS (Apple Silicon + Intel), Windows and
# Linux and publishes them as a GitHub Release, together with the updater
# artifacts and `latest.json` the in-app auto-updater reads.
#
# Trigger: push a tag like `v0.2.0` (the tag must match tauri.conf.json's
# version). Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    # The auto-updater compares versions: a tag whose app version was not bumped
    # publishes a latest.json that installed copies treat as "no update".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version everywhere
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r .version latex-p2p-editor/src-tauri/tauri.conf.json)
          PKG=$(jq -r .version latex-p2p-editor/package.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' latex-p2p-editor/src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG tauri.conf=$CONF package.json=$PKG Cargo.toml=$CARGO"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v$TAG does not match the app version. Bump tauri.conf.json, package.json and Cargo.toml before tagging."
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: latex-p2p-editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: latex-p2p-editor/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: latex-p2p-editor
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: latex-p2p-editor
          tagName: ${{ github.ref_name }}
          releaseName: "LaTeX P2P ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. Installed copies update themselves."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
